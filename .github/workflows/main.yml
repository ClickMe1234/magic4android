name: TV build
on:
  push:
    branches: [android-receiver]
    paths: ['webos/**', '.github/workflows/main.yml']
  pull_request:
    paths: ['webos/**', '.github/workflows/main.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test test/sensor-recovery.test.cjs
      - run: npm run build-p
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: magic4android-tv
          path: webos/*.ipk
